# ==============================================================================
#                  Конфигурация VanillaBridge (Paper 26.3)
# ==============================================================================

# ------------------------------------------------------------------------------
# Идентификатор сервера: "main" (текущий сервер) или "vps" (новый сервер на VPS)
# ------------------------------------------------------------------------------
server-id: "main"

# ------------------------------------------------------------------------------
# Подключение к Discord боту с автоматическим обходом блокировок РКН (WSS 443)
# ------------------------------------------------------------------------------
bridge:
  # Включение подключения к мосту (true - включено, false - выключено)
  enabled: true
  # Основной адрес моста (по умолчанию защищенный Cloudflare WSS порт 443 — обход блокировок РКН)
  ws-url: "wss://bridge.vanillaland.fun/ws"
  # Дополнительные резервные адреса для обхода блокировок РКН (автоматический перебор при сбоях)
  fallback-urls:
    - "wss://play.vanillaland.fun/ws"
    - "wss://vanillaland.fun/ws"
    - "wss://bridge.vanillaland.fun:8443/ws"
    - "ws://bridge.vanillaland.fun:80/ws"
    - "ws://fi4.bot-hosting.cloud:25549/ws"
    - "ws://81.30.105.141:25007/ws"
  token: "R6rU8Y9nNpZRC8w-X0J6EFwvkPTOi-BdGlhADYrrwPs"
  reconnect-delay-seconds: 5

# ------------------------------------------------------------------------------
# Настройки безопасности и двухфакторной аутентификации (2FA)
# Для отключения 2FA на старом сервере установите enabled: false
# Также переключается командой: /bridge 2fa <on|off>
# ------------------------------------------------------------------------------
security:
  # Срок доверия к IP по умолчанию (часы). Discord может переопределить его:
  # 0 = строгий режим (подтверждение при каждом входе)
  trust-duration-hours: 48
  two-factor:
    enabled: false

# ------------------------------------------------------------------------------
# Формат отображения сообщений из Discord в игре
# ------------------------------------------------------------------------------
discord-format:
  # \u0152 — иконка Discord из ресурспака сервера (civilization:ui/general/discord.png)
  use-icon: true
  icon: "\u0152"
  # Цвет или градиент бейджа Discord:
  # По умолчанию оригинальный градиент Discord Blurple: "<gradient:#5865F2:#7289DA>"
  # Одиночный цвет можно указать как "#5865F2" или "<color:#5865F2>"
  badge-gradient: "<gradient:#5865F2:#7289DA>"
  chat: "%icon% %badge% &8| &f%author%&8: &f%message%"
  hover-text: "&7Сообщение из Discord\n&eКлик: ответить"

# ------------------------------------------------------------------------------
# Упоминания игроков через @Ник из Discord
# ------------------------------------------------------------------------------
mentions:
  enabled: true
  sound:
    enabled: true
    name: "block.note_block.pling"
    volume: 1.0
    pitch: 1.5

# ------------------------------------------------------------------------------
# Пересылка событий из игры в Discord
# ------------------------------------------------------------------------------
events:
  send-join: true
  send-quit: true
  send-death: true
