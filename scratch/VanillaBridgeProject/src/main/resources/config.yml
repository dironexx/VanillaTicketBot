# ==============================================================================
#                  Конфигурация VanillaBridge (Paper 26.3)
# ==============================================================================

# ------------------------------------------------------------------------------
# Идентификатор сервера: "main" (текущий сервер) или "vps" (новый сервер на VPS)
# ------------------------------------------------------------------------------
server-id: "main"

# ------------------------------------------------------------------------------
# Подключение к Discord боту с автоматическим обходом блокировок РКН (WSS 443)
# ------------------------------------------------------------------------------
bridge:
  # Включение подключения к мосту (true - включено, false - выключено)
  enabled: true
  # Основной адрес моста (локальный порт бота на том же хостинге или публичный порт 25007)
  ws-url: "ws://127.0.0.1:25007/ws"
  # Дополнительные резервные адреса для обхода блокировок РКН (автоматический перебор при сбоях)
  fallback-urls:
    - "ws://127.0.0.1:25549/ws"
    - "ws://172.17.0.1:25007/ws"
    - "ws://play.vanillaland.fun:25007/ws"
    - "ws://play.vanillaland.fun:25549/ws"
    - "ws://213.171.18.142:25007/ws"
    - "ws://213.171.18.142:25549/ws"
    - "wss://bridge.vanillaland.fun/ws"
    - "wss://play.vanillaland.fun/ws"
  token: "R6rU8Y9nNpZRC8w-X0J6EFwvkPTOi-BdGlhADYrrwPs"
  reconnect-delay-seconds: 5
  # Режим отладки (вывод каждого маршрута в консоль, по умолчанию false чтобы не спамить)
  debug: false

# ------------------------------------------------------------------------------
# Пересылка событий из игры в Discord
# ------------------------------------------------------------------------------
events:
  send-join: true
  send-quit: true
  send-death: true
